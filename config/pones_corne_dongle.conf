# Two keyboard peripherals plus the five existing host-profile slots.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# v0.3 restricts this HID feature to the central role.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Report both halves' batteries to the host; fetching alone only feeds the UI.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Stronger radio for half and host links.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Standard Prospector: ST7789 display, PWM backlight and APDS9960 sensor.
# prospector_adapter supplies its display, widgets and battery-fetch defaults.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y
