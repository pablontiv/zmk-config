# Five-column peripherals with a Prospector dongle central.
CONFIG_ZMK_KEYBOARD_NAME="Pones Corne"
CONFIG_ZMK_POINTING=y

# Display defaults are role-specific in the shield's Kconfig.defconfig.
# Smooth scrolling is central-only; enable it in pones_corne_dongle.conf.
# Lighting remains outside this port.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Stronger radio for half-to-dongle links (ZMK connection-issues guidance).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
