name: ZMK release watch

# Dependabot does not understand west manifests, so this checks weekly whether
# the latest ZMK release differs from the revision pinned in config/west.yml
# and opens (once) an issue when an update is available.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned ZMK with latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(awk '/- name: zmk$/{f=1} f && /revision:/{print $2; exit}' config/west.yml)
          tag=$(gh api repos/zmkfirmware/zmk/releases/latest --jq .tag_name)
          latest=$(gh api "repos/zmkfirmware/zmk/commits/$tag" --jq .sha)
          echo "pinned=$pinned latest=$tag ($latest)"
          if [ "$pinned" = "$latest" ] || [ "$pinned" = "$tag" ]; then
            echo "ZMK is up to date."
            exit 0
          fi
          title="ZMK $tag is available"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "Issue already exists for $tag."
            exit 0
          fi
          gh label create zmk-update --color 4b6bfb --description "New upstream ZMK release" --force
          gh issue create --label zmk-update --title "$title" --body "$(cat <<EOF
          A new ZMK release is available: [$tag](https://github.com/zmkfirmware/zmk/releases/tag/$tag).

          - Pinned in \`config/west.yml\`: \`$pinned\`
          - Release commit: \`$latest\`

          Before upgrading, review the release notes for breaking changes (Zephyr version,
          input/pointing APIs, split behavior) and check that the Cirque module and the
          vendored YADS screen support it. Then update \`config/west.yml\`, rebuild all three
          images and follow [docs/build-and-flash.md](docs/build-and-flash.md).
          EOF
          )"
